<div class="container-fluid mt-5">
    <div class="row">
        <div class="col-md-6 offset-3">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="bg-info p-2 text-center">Post Info</h2>
                    <h3><strong>{{isInEditMode ? 'Update Post' : 'Add Post'}}</strong></h3>
                    <div class="form-group">
                        <label for="title">Enter Title*</label>
                        <input type="text" class="form-control" placeholder="Enter Title" #title>

                        <label for="content">Enter Content*</label>
                        <textarea class="form-control mb-3" rows="2" #content>Enter Content</textarea>

                        <div>
                            <button class="w-100" *ngIf="!isInEditMode" (click)="onAddPost()" mat-raised-button color="primary">Add
                                Post</button>
                            <button class="w-100" *ngIf="isInEditMode" (click)="onUpdatePost()" mat-raised-button color="warn">Update
                                Post</button>

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>


<div class="container-fluid mb-4">
    <div *ngIf="postsArr.length > 0 ; else no" >
    <div class="row">
            <div class="col-md-3 mt-4" *ngFor="let post of postsArr;">
                <div class="card shadow h-100">
                    <div class="card-header"><strong>{{post.title}}</strong></div>
                    <div class="card-body">{{post.content}}</div>
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <button (click)="onEditPost(post)" mat-mini-fab
                            color="primary"><mat-icon>edit</mat-icon></button>
                        <button (click)="onDeletePost(post.id)" mat-mini-fab
                            color="accent"><mat-icon>delete</mat-icon></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
        <ng-template #no>
            <p class="alert alert=warning">No Posts Added Yet</p>
        </ng-template>
</div>
